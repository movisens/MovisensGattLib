apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'
apply plugin: 'maven-publish'

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

group = 'com.github.movisens'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

def releaseVersionFile = rootProject.file('version.properties')
if (!releaseVersionFile.exists()) throw new GradleException("version.properties not found in ${rootProject.projectDir}")
def releaseVersionProps = new Properties(); releaseVersionFile.withInputStream { releaseVersionProps.load(it) }
version = providers.gradleProperty('releaseVersion').orNull ?: releaseVersionProps.getProperty('version')

repositories {
	mavenLocal()
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

dependencies {
    api "com.github.movisens:SmartGattLib:${smart_gatt_lib_version}"
    testImplementation group: 'junit', name: 'junit', version: '4.11'
}

sourceSets {
    main {
        java {
            srcDir('src-gen/main/java')
        }
    }
}

//OSGI specific entries that are not automatically generated
jar {
    manifest {
        attributes(
                'Bundle-SymbolicName': "${project.group}.${project.name}",
                'Bundle-Version': project.version,
                'Export-Package': [
                        'com.movisens.movisensgattlib',
                        'com.movisens.movisensgattlib.attributes',
                        'com.movisens.movisensgattlib.helper',
                        'com.movisens.movisensgattlib.security'
                ].join(',')
        )
    }
}
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
